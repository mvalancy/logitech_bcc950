# Fast lane: feature/* -> dev, and pushes to dev.
#
# Python only — it runs in seconds. The C++ build fetches GoogleTest via
# FetchContent and takes a few minutes, so it lives in the deep lane.
#
# The default pytest run is already CI-safe by design: pyproject sets
# addopts = "-m 'not hardware and not vision'", so the 5 hardware and 9 vision
# tests deselect themselves without a camera attached.
name: fast

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python tests (no hardware)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install without the optional vision extra
        # Deliberately NOT installing opencv. If the package ever regresses to
        # importing cv2 at import time, this job fails — which is exactly the
        # bug this PR fixes, and the only way to keep the extra honest.
        working-directory: src/python
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Tests
        working-directory: src/python
        run: python -m pytest tests -q
